services:
  openstock:
    build:
      context: .
      args:
        # Baked into the client bundle at build time, so it must be a build arg.
        NEXT_PUBLIC_FINNHUB_API_KEY: ${NEXT_PUBLIC_FINNHUB_API_KEY}
    ports:
      - "3000:3000"
    environment:
      # Set explicitly rather than via env_file: the local .env points Mongo at
      # 127.0.0.1, which inside this container is the container itself, not the
      # mongodb service.
      NODE_ENV: production
      MONGODB_URI: mongodb://root:example@mongodb:27017/openstock?authSource=admin
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      NEXT_PUBLIC_FINNHUB_API_KEY: ${NEXT_PUBLIC_FINNHUB_API_KEY}
      FINNHUB_BASE_URL: ${FINNHUB_BASE_URL:-https://finnhub.io/api/v1}
      # Server-only; read at runtime, never bundled into the client.
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      # Telegram. All of these are also editable at runtime from /settings, which wins —
      # these entries just allow first-boot configuration from the environment.
      TELEGRAM_STOCK_BOT_TOKEN: ${TELEGRAM_STOCK_BOT_TOKEN:-}
      TELEGRAM_STOCK_CHAT_ID: ${TELEGRAM_STOCK_CHAT_ID:-}
      TELEGRAM_CRYPTO_BOT_TOKEN: ${TELEGRAM_CRYPTO_BOT_TOKEN:-}
      TELEGRAM_CRYPTO_CHAT_ID: ${TELEGRAM_CRYPTO_CHAT_ID:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-true}
      # Gates the /settings page. When unset, the earliest-registered user is the admin.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    restart: unless-stopped
    # Probes the app's own health endpoint, which also reports whether it can reach Mongo
    # and whether the scheduled jobs last succeeded.
    #
    # 127.0.0.1, not localhost: inside the container localhost can resolve to ::1, and the
    # server binds IPv4 — so the probe gets "connection refused" while the app is perfectly
    # healthy. Same address-family trap documented in instrumentation.ts.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
